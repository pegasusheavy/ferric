[package]
name = "ferric_idb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Ergonomic async wrapper for IndexedDB in WebAssembly"
keywords = ["wasm", "webassembly", "indexeddb", "database", "storage"]
categories = ["wasm", "web-programming", "database"]

[lib]
crate-type = ["rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbKeyRange",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbCursorDirection",
    "IdbIndex",
    "IdbIndexParameters",
    "IdbVersionChangeEvent",
    "DomException",
    "DomStringList",
    "Event",
    "EventTarget",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
thiserror = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

