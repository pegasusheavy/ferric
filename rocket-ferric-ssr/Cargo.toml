[package]
name = "rocket-ferric-ssr"
version = "0.1.0"
edition = "2024"
authors = ["Joseph R Quinn"]
license = "MIT"
repository = "https://github.com/username/ferric"
description = "Ferric SSR integration for Rocket framework"

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-ssr = { path = "../ferric-ssr" }
rocket = { version = "0.5", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"

[dev-dependencies]
rocket = { version = "0.5", features = ["json", "secrets"] }

[features]
default = []

