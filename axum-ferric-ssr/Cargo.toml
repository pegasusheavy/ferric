[package]
name = "axum-ferric-ssr"
version = "0.1.0"
edition = "2024"
authors = ["Joseph R Quinn"]
license = "MIT"
repository = "https://github.com/username/ferric"
description = "Ferric SSR integration for Axum framework"

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-ssr = { path = "../ferric-ssr" }
axum = { version = "0.7", features = ["tokio"] }
hyper = { version = "1.0", features = ["server", "http1", "http2"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "compression-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
compression = ["tower-http/compression-full"]

