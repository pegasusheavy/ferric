# Ferric Documentation Website Configuration

[project]
name = "ferric-docs"
version = "0.1.0"
description = "Documentation and introduction website for the Ferric framework"

[build]
out_dir = "dist"
src_dir = "src"
optimization = "release"
source_maps = false
wasm_opt = "s"

[build.targets]
browser = true
server = false

# Cache busting configuration for production builds
[build.cache_busting]
# Enable cache busting (adds content hash to filenames)
enabled = true
# Hash strategy: "md5" (fast), "sha256" (secure), or "timestamp"
strategy = "md5"
# Length of hash to append to filename
hash_length = 8
# Apply to CSS files (styles.css -> styles.a1b2c3d4.css)
css = true
# Apply to JS/Wasm files (pkg files)
js = true
# Apply to assets (images, fonts, etc)
assets = false

[ssr]
enabled = false

[styles]
# Using TailwindCSS via npm/pnpm - CSS is compiled separately
preprocessor = "css"
root = "src/styles.css"
output = "styles.css"
output_style = "compressed"

[serve]
port = 8080
host = "127.0.0.1"
live_reload = true
open = true

[assets]
dir = "assets"
copy = ["favicon.svg"]
hash = false
