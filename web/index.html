<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ferric - A high-performance web framework built with Rust and WebAssembly">
    <meta name="keywords" content="rust, webassembly, wasm, web framework, reactive, frontend">
    <meta name="author" content="Ferric Contributors">

    <title>Ferric - Rust Web Framework</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <!-- TailwindCSS compiled styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Inline critical styles for loading state -->
    <style>
        .loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }
        .dark .loading {
            background: #020617;
        }
        .loading__spinner {
            width: 3rem;
            height: 3rem;
            border: 2px solid transparent;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading__text {
            color: #64748b;
            margin-top: 1rem;
        }
        .dark .loading__text {
            color: #94a3b8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="app">
        <!-- Loading state (replaced when WASM loads) -->
        <div class="loading">
            <div class="text-center">
                <div class="loading__spinner mx-auto"></div>
                <p class="loading__text">Loading Ferric...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import init from './pkg/ferric_docs.js';

        async function run() {
            try {
                await init();
            } catch (e) {
                console.error('Failed to initialize Ferric:', e);
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <div class="text-center">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #0f172a;">Failed to load</h1>
                            <p class="loading__text" style="margin-bottom: 1rem;">
                                There was an error loading the application.
                            </p>
                            <button onclick="location.reload()"
                                    style="padding: 0.75rem 1.5rem; background: linear-gradient(to right, #f97316, #dc2626); color: white; border: none; border-radius: 0.75rem; cursor: pointer; font-weight: 600;">
                                Reload
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        run();
    </script>
</body>
</html>
