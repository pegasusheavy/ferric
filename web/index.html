<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferric Framework - Build blazingly fast web applications with Rust</title>
    <meta name="description" content="Ferric is a modern web framework for Rust with Angular-inspired architecture, reactive programming, and WebAssembly performance.">

    <!-- Rust-themed TailwindCSS -->
    <link href="/styles/dist/rust-theme.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦀</text></svg>">
</head>
<body class="font-rust">
    <!-- Ferric Application Root -->
    <app-root></app-root>

    <!-- Wasm Module -->
    <script type="module">
        import init from './pkg/ferric_docs_site.js';

        async function run() {
            try {
                await init();
                console.log('🦀 Ferric Documentation Site loaded!');
            } catch (error) {
                console.error('Failed to load Ferric:', error);
                document.querySelector('app-root').innerHTML = `
                    <div style="padding: 2rem; text-align: center;">
                        <h1 style="color: #f2711e;">⚠️ Failed to load application</h1>
                        <p>Please make sure WebAssembly is enabled in your browser.</p>
                        <pre style="text-align: left; background: #f5f5f5; padding: 1rem; margin: 1rem auto; max-width: 600px;">${error}</pre>
                    </div>
                `;
            }
        }

        run();
    </script>
</body>
</html>
