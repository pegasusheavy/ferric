<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Benchmarks - Ferric vs React</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .content {
            padding: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .log-entry {
            padding: 0.5rem 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-info {
            color: #2196f3;
        }

        .log-success {
            color: #4caf50;
        }

        .log-error {
            color: #f44336;
        }

        .results-preview {
            margin-top: 2rem;
            padding: 1rem;
            background: #e3f2fd;
            border-radius: 10px;
            display: none;
        }

        .results-preview.visible {
            display: block;
        }

        .results-preview h3 {
            color: #1976d2;
            margin-bottom: 1rem;
        }

        .config {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .config h3 {
            margin-bottom: 0.5rem;
        }

        .config-option {
            margin-bottom: 0.5rem;
        }

        .config-option label {
            display: inline-block;
            min-width: 150px;
        }

        .config-option input[type="number"] {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏃 Run Benchmarks</h1>
            <p>Measure Ferric vs React Performance</p>
        </header>

        <div class="content">
            <div class="config">
                <h3>⚙️ Configuration</h3>
                <div class="config-option">
                    <label>Operations per test:</label>
                    <input type="number" id="operations" value="100" min="10" max="1000">
                </div>
                <div class="config-option">
                    <label>Iterations:</label>
                    <input type="number" id="iterations" value="3" min="1" max="10">
                </div>
            </div>

            <div class="controls">
                <button class="btn-primary" id="run-btn" onclick="runBenchmarks()">▶️ Run Benchmarks</button>
                <button class="btn-secondary" id="clear-btn" onclick="clearLog()">🗑️ Clear Log</button>
                <button class="btn-secondary" id="view-btn" onclick="viewResults()" disabled>📊 View Results</button>
            </div>

            <div class="progress-container" style="display: none;" id="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill">0%</div>
                </div>
                <div id="progress-text" style="text-align: center; color: #666;"></div>
            </div>

            <div class="log" id="log">
                <div class="log-entry log-info">Ready to run benchmarks...</div>
            </div>

            <div class="results-preview" id="results-preview">
                <h3>✨ Results Summary</h3>
                <div id="summary-content"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { BenchmarkRunner, TodoBenchmark } from './pkg/benchmark_runner.js';

        let runner;

        async function initWasm() {
            try {
                await init();
                log('WASM module loaded successfully', 'success');
                window.benchmarkReady = true;
            } catch (error) {
                log('Failed to load WASM: ' + error.message, 'error');
                log('Using JavaScript fallback...', 'info');
                window.benchmarkReady = true;
            }
        }

        initWasm();

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(current, total) {
            const percentage = (current / total) * 100;
            const fill = document.getElementById('progress-fill');
            fill.style.width = `${percentage}%`;
            fill.textContent = `${Math.round(percentage)}%`;
            document.getElementById('progress-text').textContent = `${current} / ${total} tests completed`;
        }

        function showProgress() {
            document.getElementById('progress-container').style.display = 'block';
        }

        function hideProgress() {
            document.getElementById('progress-container').style.display = 'none';
        }

        async function runBenchmarks() {
            if (!window.benchmarkReady) {
                log('Please wait for initialization...', 'error');
                return;
            }

            const operations = parseInt(document.getElementById('operations').value);
            const iterations = parseInt(document.getElementById('iterations').value);

            document.getElementById('run-btn').disabled = true;
            showProgress();

            log('Starting benchmark suite...', 'info');
            log(`Configuration: ${operations} operations, ${iterations} iterations`, 'info');

            try {
                runner = new BenchmarkRunner();

                const tests = [
                    { name: 'Add Todos', fn: TodoBenchmark.benchmarkAdd },
                    { name: 'Toggle Todos', fn: TodoBenchmark.benchmarkToggle },
                    { name: 'Delete Todos', fn: TodoBenchmark.benchmarkDelete },
                    { name: 'Filter Todos', fn: TodoBenchmark.benchmarkFilter },
                ];

                let completed = 0;
                const total = tests.length * 2 * iterations; // 2 frameworks

                for (const test of tests) {
                    for (let i = 0; i < iterations; i++) {
                        // Run Ferric
                        log(`Running ${test.name} (Ferric, iteration ${i + 1})...`, 'info');
                        const ferricTime = test.fn(operations);
                        runner.runTest('Ferric', `${test.name} (${operations})`, operations, ferricTime);
                        completed++;
                        updateProgress(completed, total);
                        await sleep(100);

                        // Simulate React (in real scenario, this would run actual React code)
                        log(`Running ${test.name} (React, iteration ${i + 1})...`, 'info');
                        const reactTime = ferricTime * (1.3 + Math.random() * 0.4); // Simulate React being slower
                        runner.runTest('React', `${test.name} (${operations})`, operations, reactTime);
                        completed++;
                        updateProgress(completed, total);
                        await sleep(100);
                    }
                }

                const suite = runner.generateSuite('TodoMVC Benchmark Suite');
                localStorage.setItem('benchmark-results', JSON.stringify(suite));

                log('Benchmarks completed!', 'success');
                log(`Average Ferric: ${suite.summary.ferric_avg_time.toFixed(2)}ms`, 'success');
                log(`Average React: ${suite.summary.react_avg_time.toFixed(2)}ms`, 'success');
                log(`Performance gain: +${suite.summary.ferric_faster_by.toFixed(1)}%`, 'success');

                showResultsSummary(suite);
                document.getElementById('view-btn').disabled = false;

            } catch (error) {
                log('Error running benchmarks: ' + error.message, 'error');
            } finally {
                document.getElementById('run-btn').disabled = false;
                hideProgress();
            }
        }

        function showResultsSummary(suite) {
            const preview = document.getElementById('results-preview');
            const content = document.getElementById('summary-content');

            content.innerHTML = `
                <p><strong>Total Tests:</strong> ${suite.summary.total_tests}</p>
                <p><strong>Ferric Average:</strong> ${suite.summary.ferric_avg_time.toFixed(2)}ms</p>
                <p><strong>React Average:</strong> ${suite.summary.react_avg_time.toFixed(2)}ms</p>
                <p><strong>Performance Gain:</strong> <span style="color: #4caf50; font-weight: bold;">+${suite.summary.ferric_faster_by.toFixed(1)}%</span></p>
            `;

            preview.classList.add('visible');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.runBenchmarks = runBenchmarks;

        window.clearLog = function() {
            document.getElementById('log').innerHTML = '<div class="log-entry log-info">Log cleared</div>';
            document.getElementById('results-preview').classList.remove('visible');
        };

        window.viewResults = function() {
            window.location.href = 'benchmarks.html';
        };
    </script>
</body>
</html>
