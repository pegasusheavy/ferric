[package]
name = "ferric-docs-site"
version = "0.1.0"
edition = "2024"
authors = ["Joseph R Quinn"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-macros = { path = "../ferric-macros" }
ferric-forms = { path = "../ferric-forms" }
ferric-http = { path = "../ferric-http" }
ferric-markdown = { path = "../ferric-markdown" }

# Wasm bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "HtmlElement",
    "Element",
    "Node",
    "Text",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlButtonElement",
    "Location",
    "History",
] }
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Utilities
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
