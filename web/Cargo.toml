[package]
name = "ferric-docs"
version = "0.1.0"
edition = "2021"
description = "Ferric Framework Documentation Website"
authors = ["Ferric Contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric_macros = { path = "../ferric-macros" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlStyleElement",
    "HtmlHeadElement",
    "HtmlButtonElement",
    "Node",
    "NodeList",
    "Window",
    "Location",
    "History",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "ScrollBehavior",
    "ScrollToOptions",
    "DomTokenList",
    "CssStyleDeclaration",
    "MediaQueryList",
    "Storage",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = "0.3"
gloo-utils = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
