[package]
name = "warp-ferric-ssr"
version = "0.1.0"
edition = "2024"
authors = ["Joseph R Quinn"]
license = "MIT"
repository = "https://github.com/username/ferric"
description = "Ferric SSR integration for Warp framework"

[dependencies]
ferric-core = { path = "../ferric-core" }
ferric-ssr = { path = "../ferric-ssr" }
warp = "0.3"
hyper = "1.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
async-trait = "0.1"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
compression = []

