[workspace]
members = [
    "ferric-core",
    "ferric-macros",
    "ferric-cli",
    "ferric-forms",
    "ferric-forms-macros",
    "ferric-http",
    "ferric-idb",
    "ferric-markdown",
    "ferric-ssr",
    "armature-ferric-ssr",
    "axum-ferric-ssr",
    "warp-ferric-ssr",
    "rocket-ferric-ssr",
    "poem-ferric-ssr",
    "examples/todo-app",
    "examples/reactivity-demo",
    "examples/ssr-demo",
    "examples/markdown-demo",
    "examples/file-transfer-demo",
    "benchmarks/todo-comparison/ferric-todo",
    "benchmarks/todo-comparison/benchmark-runner",
    "benchmarks/core-benchmarks",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Joseph R Quinn"]
license = "MIT"
repository = "https://github.com/username/ferric"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
rustc-hash = "2.0"
console_error_panic_hook = "0.1"

# Macro dependencies
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.20"

[workspace.dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

