[package]
name = "ferric-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for Ferric framework - scaffolding, building, and development"
license = "MIT"
authors = ["Ferric Contributors"]
keywords = ["wasm", "web", "cli", "scaffolding", "build"]
categories = ["command-line-utilities", "development-tools", "wasm"]

[[bin]]
name = "ferric"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env", "color"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# File system operations
walkdir = "2.4"
glob = "0.3"
fs_extra = "1.3"

# Template rendering
handlebars = "5.1"

# SCSS compilation
grass = "0.13"

# Process execution
which = "6.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Hashing for cache busting
md5 = "0.7"
sha2 = "0.10"

# Console output
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"

# Armature HTTP framework for dev server
armature = { git = "https://github.com/pegasusheavy/armature.git", branch = "develop" }

# HTTP server (also used by Armature)
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.5"

# WebSocket for hot reload
tokio-tungstenite = "0.21"
futures-util = "0.3"

# File watching
notify = "6.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc utilities
regex = "1.10"
chrono = "0.4"
dirs = "5.0"
open = "5.0"
mime_guess = "2.0"

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"
