[package]
name = "markdown-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferric-core = { path = "../../ferric-core" }
ferric_macros = { path = "../../ferric-macros" }
ferric-markdown = { path = "../../ferric-markdown" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

