[package]
name = "reactivity-demo"
version = "0.1.0"
edition = "2021"
description = "Comprehensive demonstration of Ferric's reactive system"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferric-core = { path = "../../ferric-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlStyleElement",
    "Window",
    "Node",
    "NodeList",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "Storage",
    "DomTokenList",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

