<div class="demo-card">
    <h2 class="demo-title">📝 Form Validation Demo</h2>
    <p class="demo-description">
        Demonstrates reactive form validation with <code>computed()</code>.
    </p>

    <form id="signup-form" class="validation-form">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" class="input">
            <div id="username-errors" class="field-errors"></div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email" class="input">
            <div id="email-errors" class="field-errors"></div>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" class="input">
            <div id="password-errors" class="field-errors"></div>
            <div class="password-strength">
                <div class="strength-bar">
                    <div id="strength-fill" class="strength-fill"></div>
                </div>
                <span id="strength-text" class="strength-text">Password strength</span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" class="input">
            <div id="confirm-errors" class="field-errors"></div>
        </div>

        <div class="form-actions">
            <button type="submit" id="submit-btn" disabled class="btn btn-primary">Create Account</button>
            <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>

        <div id="submit-result" class="submit-result hidden"></div>
    </form>

    <div class="debug-section">
        <h4 class="debug-title">Form State (Debug):</h4>
        <pre id="form-state-debug" class="debug-output"></pre>
    </div>
</div>
