[workspace]
members = ["core", "admin", "dashboard"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ferric Contributors"]

[workspace.dependencies]
ferric-core = { path = "../../ferric-core" }
ferric_macros = { path = "../../ferric-macros" }
ferric-router = { path = "../../ferric-router" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }

