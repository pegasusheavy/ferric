[package]
name = "ssr-demo"
version = "0.1.0"
edition = "2021"
description = "Demonstration of Ferric's server-side rendering capabilities"

[[bin]]
name = "ssr-demo"
path = "src/main.rs"

[dependencies]
ferric-ssr = { path = "../../ferric-ssr" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = "1.0"
