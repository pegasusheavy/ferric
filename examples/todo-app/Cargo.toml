[package]
name = "todo-app"
version = "0.1.0"
edition = "2021"
authors = ["Joseph R Quinn"]
license = "MIT"
description = "Todo list example application using the Ferric framework"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferric-core = { path = "../../ferric-core" }
ferric_forms = { path = "../../ferric-forms" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlHeadElement",
    "HtmlStyleElement",
    "Node",
    "NodeList",
    "Window",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "InputEvent",
    "Storage",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true

