<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferric Todo App</title>

    <!-- Tailwind CSS for utility classes used in component styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: {
                            DEFAULT: '#e85d04',
                            hover: '#ff6b1a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base page styles */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #09090b 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #app {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Loading spinner */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px;
            color: #71717a;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3f3f46;
            border-top-color: #e85d04;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading state - replaced by app -->
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script type="module">
        import init from './pkg/todo_app.js';

        async function run() {
            await init();
        }

        run().catch(console.error);
    </script>
</body>
</html>
