name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run tests with coverage
        run: |
          cargo tarpaulin --lib \
            --timeout 300 \
            --out Xml \
            --out Html \
            --output-dir coverage \
            --exclude-files 'examples/*' \
            --exclude-files 'benchmarks/*' \
            --exclude-files 'web/*' \
            --exclude-files 'ferric-cli/*' \
            -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage results
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('./coverage/cobertura.xml', 'utf8');
            const coverage = xml.match(/line-rate="([0-9.]+)"/)[1];
            const percent = (parseFloat(coverage) * 100).toFixed(2);

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Code Coverage Report\n\n📊 Coverage: **${percent}%**\n\n[View full report](https://codecov.io/gh/${{github.repository}})`
            });

