name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Node dependencies
        run: |
          cd web
          npm ci

      - name: Build CSS with TailwindCSS 4
        run: |
          cd web
          npx @tailwindcss/cli@next -i ./styles/rust-theme.css -o ./styles/dist/rust-theme.min.css --minify

      - name: Build Wasm application
        run: |
          cd web
          wasm-pack build --target web --out-dir pkg --release

      - name: Generate documentation HTML
        run: |
          if [ -f scripts/generate-docs-html.sh ]; then
            bash scripts/generate-docs-html.sh
          fi

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy

          # Copy web assets
          cp -r web/index.html deploy/
          cp -r web/docs.html deploy/ || true
          cp -r web/docs-rust-theme.html deploy/ || true
          cp -r web/benchmarks.html deploy/ || true
          cp -r web/run-benchmarks.html deploy/ || true
          cp -r web/pkg deploy/
          cp -r web/styles deploy/
          cp -r web/assets deploy/ || true
          cp -r web/docs deploy/ || true

          # Create .nojekyll to disable Jekyll processing
          touch deploy/.nojekyll

          # Create CNAME if needed (update with your domain)
          # echo "ferric.rs" > deploy/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Ferric documentation site'

      - name: Display deployment URL
        run: |
          echo "🚀 Deployed to GitHub Pages!"
          echo "📄 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

