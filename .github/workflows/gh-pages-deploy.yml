name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install ferric-cli
        run: |
          echo "📦 Installing ferric-cli from workspace..."
          cargo install --path ferric-cli --force
          echo "✅ ferric-cli installed:"
          ferric --version

      - name: Install wasm-pack
        run: |
          echo "📦 Installing wasm-pack..."
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Node dependencies
        run: |
          cd web
          npm install

      - name: Build CSS with ferric-cli
        run: |
          cd web
          echo "🎨 Building CSS with TailwindCSS 4..."
          ferric tailwind -i ./styles/rust-theme.css -o ./styles/dist/rust-theme.min.css --minify
          echo "✅ CSS build complete"
          ls -la styles/dist/

      - name: Build Wasm application with ferric-cli
        run: |
          cd web
          echo "🦀 Building Wasm application..."
          ferric build --release --target browser
          echo "✅ Wasm build complete"

          # Show build output
          if [ -d "dist" ]; then
            echo "📦 Build output in dist/:"
            ls -la dist/
            [ -d "dist/pkg" ] && ls -la dist/pkg/
          else
            echo "📦 Build output:"
            ls -la pkg/ 2>/dev/null || echo "Note: pkg directory location varies"
          fi

      - name: Generate documentation HTML
        run: |
          if [ -f scripts/generate-docs-html.sh ]; then
            echo "📚 Generating documentation HTML..."
            bash scripts/generate-docs-html.sh
          fi

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy

          echo "📦 Preparing deployment directory..."

          # Copy web assets (ferric build outputs to dist/)
          if [ -d "web/dist" ]; then
            echo "  Copying from web/dist/..."
            cp web/dist/index.html deploy/ 2>/dev/null || cp web/index.html deploy/
            cp -r web/dist/pkg deploy/ 2>/dev/null || cp -r web/pkg deploy/ 2>/dev/null || true
          else
            echo "  Copying from web/..."
            cp web/index.html deploy/
            cp -r web/pkg deploy/ 2>/dev/null || true
          fi

          # Copy styles (always from web/styles)
          cp -r web/styles deploy/

          # Copy optional assets
          cp web/docs.html deploy/ 2>/dev/null || true
          cp web/docs-rust-theme.html deploy/ 2>/dev/null || true
          cp web/benchmarks.html deploy/ 2>/dev/null || true
          cp web/run-benchmarks.html deploy/ 2>/dev/null || true
          cp -r web/assets deploy/ 2>/dev/null || true
          cp -r web/docs deploy/ 2>/dev/null || true

          # Create .nojekyll to disable Jekyll processing
          touch deploy/.nojekyll

          # Create CNAME if needed (update with your domain)
          # echo "ferric.rs" > deploy/CNAME

          echo "✅ Deployment directory prepared:"
          ls -la deploy/
          echo ""
          echo "📊 Package contents:"
          ls -la deploy/pkg/ 2>/dev/null || echo "  (pkg directory not found)"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Ferric documentation site'

      - name: Display deployment URL
        run: |
          echo "🚀 Deployed to GitHub Pages!"
          echo "📄 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo ""
          echo "✨ Built with ferric-cli!"
