[package]
name = "core-benchmarks"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "reactivity"
harness = false

[[bench]]
name = "component"
harness = false

[[bench]]
name = "dom"
harness = false

[[bench]]
name = "router"
harness = false

[[bench]]
name = "forms"
harness = false

[[bench]]
name = "pipes"
harness = false

[dependencies]
ferric-core = { path = "../../ferric-core" }
ferric_forms = { path = "../../ferric-forms" }
ferric-http = { path = "../../ferric-http" }
criterion = { version = "0.8.0", features = ["html_reports"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Text",
    "Window",
] }

[dev-dependencies]
criterion = { version = "0.8.0", features = ["html_reports"] }

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

