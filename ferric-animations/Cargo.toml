[package]
name = "ferric-animations"
version = "0.1.0"
edition = "2024"
authors = ["Joseph R. Quinn <quinn.josephr@protonmail.com>"]
license = "Apache-2.0"
description = "Angular-inspired animation system for Ferric framework"
keywords = ["ferric", "animations", "web", "wasm", "transitions"]
categories = ["web-programming", "wasm"]

[dependencies]
# Wasm and web
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Animation",
    "AnimationEffect",
    "KeyframeEffect",
    "AnimationPlaybackEvent",
    "AnimationTimeline",
    "DocumentTimeline",
    "AnimationPlayState",
    "KeyframeAnimationOptions",
] }
js-sys = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

